<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1a33"/>
      <stop offset="0.45" stop-color="#23406b"/>
      <stop offset="0.72" stop-color="#c86f4a"/>
      <stop offset="0.85" stop-color="#f2b26b"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b4a74"/>
      <stop offset="1" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="mount" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3352"/>
      <stop offset="1" stop-color="#14263f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="1380" cy="760" r="260" fill="url(#sun)"/>
  <!-- stars -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="120" cy="90" r="1.5"/><circle cx="340" cy="160" r="1.2"/><circle cx="610" cy="70" r="1.6"/>
    <circle cx="880" cy="130" r="1.1"/><circle cx="1130" cy="60" r="1.4"/><circle cx="1460" cy="140" r="1.2"/>
    <circle cx="1720" cy="80" r="1.6"/><circle cx="1840" cy="210" r="1.1"/><circle cx="250" cy="260" r="1"/>
    <circle cx="1010" cy="240" r="1"/><circle cx="1600" cy="300" r="1"/>
  </g>
  <!-- Mount Royal with cross -->
  <path d="M0 760 C 180 640, 360 560, 560 545 C 720 535, 860 600, 1000 690 L 1000 820 L 0 820 Z" fill="url(#mount)"/>
  <g stroke="#f7d9a8" stroke-width="5" opacity="0.85">
    <line x1="560" y1="470" x2="560" y2="548"/>
    <line x1="538" y1="492" x2="582" y2="492"/>
  </g>
  <!-- downtown skyline -->
  <g fill="#0f2038">
    <rect x="640" y="600" width="60" height="220"/>
    <rect x="705" y="540" width="70" height="280"/>
    <polygon points="785,820 785,520 812,470 840,520 840,820"/>
    <rect x="850" y="580" width="55" height="240"/>
    <rect x="912" y="500" width="78" height="320"/>
    <rect x="1000" y="560" width="50" height="260"/>
    <polygon points="1058,820 1058,530 1100,500 1142,530 1142,820"/>
    <rect x="1150" y="610" width="64" height="210"/>
    <rect x="1220" y="570" width="46" height="250"/>
    <rect x="1272" y="640" width="70" height="180"/>
  </g>
  <!-- lit windows -->
  <g fill="#ffd27a" opacity="0.55">
    <rect x="720" y="580" width="6" height="8"/><rect x="740" y="620" width="6" height="8"/><rect x="755" y="660" width="6" height="8"/>
    <rect x="930" y="540" width="6" height="8"/><rect x="955" y="600" width="6" height="8"/><rect x="970" y="680" width="6" height="8"/>
    <rect x="1075" y="580" width="6" height="8"/><rect x="1110" y="640" width="6" height="8"/><rect x="1235" y="610" width="6" height="8"/>
    <rect x="860" y="620" width="6" height="8"/><rect x="1165" y="660" width="6" height="8"/><rect x="800" y="560" width="6" height="8"/>
  </g>
  <!-- Olympic Stadium with inclined tower -->
  <g fill="#0f2038">
    <path d="M1420 820 C 1450 760, 1600 745, 1680 790 L 1690 820 Z"/>
    <polygon points="1640,820 1668,820 1590,560 1572,566"/>
    <polygon points="1566,560 1600,548 1606,566 1574,578"/>
  </g>
  <!-- low eastern buildings -->
  <g fill="#132a47">
    <rect x="1700" y="740" width="90" height="80"/><rect x="1795" y="710" width="60" height="110"/><rect x="1860" y="760" width="60" height="60"/>
    <rect x="360" y="720" width="80" height="100"/><rect x="450" y="700" width="60" height="120"/><rect x="520" y="740" width="90" height="80"/>
  </g>
  <!-- river -->
  <rect x="0" y="820" width="1920" height="260" fill="url(#river)"/>
  <g stroke="#f2b26b" stroke-width="3" opacity="0.25">
    <line x1="1250" y1="860" x2="1500" y2="860"/><line x1="1300" y1="900" x2="1460" y2="900"/><line x1="1340" y1="945" x2="1420" y2="945"/>
  </g>
  <!-- Jacques Cartier Bridge -->
  <g stroke="#0a1628" stroke-width="6" fill="none">
    <line x1="1180" y1="840" x2="1920" y2="840"/>
    <path d="M1420 840 Q 1520 760 1620 840"/>
    <path d="M1620 840 Q 1720 760 1820 840"/>
    <line x1="1470" y1="802" x2="1470" y2="840"/><line x1="1520" y1="788" x2="1520" y2="840"/><line x1="1570" y1="802" x2="1570" y2="840"/>
    <line x1="1670" y1="802" x2="1670" y2="840"/><line x1="1720" y1="788" x2="1720" y2="840"/><line x1="1770" y1="802" x2="1770" y2="840"/>
  </g>
  <g fill="#0a1628">
    <rect x="1414" y="840" width="12" height="80"/><rect x="1614" y="840" width="12" height="80"/><rect x="1814" y="840" width="12" height="80"/>
  </g>
</svg>
